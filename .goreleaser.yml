# GoReleaser configuration for LUMINA
# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: lumina
    binary: lumina
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: lumina-archive
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md
      - docs/**/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'README'
  groups:
    - title: 'New Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug Fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Performance Improvements'
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: 'Refactoring'
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 3
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: lumina
    name: ccn
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
  footer: |
    ## Installation

    ### macOS (Homebrew)
    ```bash
    brew install lumina/tap/ccn
    ```

    ### Binary Download
    Download the appropriate binary for your platform from the assets below.

    ### From Source
    ```bash
    git clone https://github.com/lumina/ccn.git
    cd ccn
    go build -o lumina
    ```

    ## Upgrade Notes
    See [CHANGELOG.md](https://github.com/lumina/ccn/blob/main/CHANGELOG.md) for detailed changes.

brews:
  - name: ccn
    repository:
      owner: lumina
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/lumina/ccn
    description: "LUMINA - Claude Code Navigator: A blazing-fast TUI markdown viewer"
    license: MIT
    install: |
      bin.install "lumina"
    test: |
      system "#{bin}/lumina", "--version"

nfpms:
  - id: lumina-nfpm
    package_name: lumina
    homepage: https://github.com/lumina/ccn
    maintainer: Your Name <your.email@example.com>
    description: "LUMINA - Claude Code Navigator: A blazing-fast TUI markdown viewer"
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
